[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "travel-agent"
version = "0.1.0"
description = "A small ReAct travel assistant with weather and attraction tools"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=2.0,<3",
    "requests>=2.32,<3",
    "tavily-python>=0.7,<1",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.6,<1",
]

[project.scripts]
travel-agent = "travel_agent.cli:main"

[tool.setuptools.packages.find]
include = ["travel_agent*"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
